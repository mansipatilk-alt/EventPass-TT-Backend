<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>EventPass - Registration</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-link:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 36px;
            color: #111827;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 16px;
        }

        .content {
            display: flex;
            gap: 35px;
            align-items: flex-start;
            justify-content: center;
        }

        .form-card {
            background: white;
            width: 430px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            margin-bottom: 25px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        #ticketSection {
            display: none;
            width: 430px;
        }

        .ticket {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .ticket-header {
            background: #111827;
            color: white;
            padding: 25px;
        }

        .ticket-header h2 {
            margin-bottom: 7px;
        }

        .ticket-header p {
            color: #d1d5db;
            font-size: 14px;
        }

        .ticket-body {
            padding: 25px;
        }

        .ticket-info {
            margin-bottom: 20px;
        }

        .ticket-info p {
            margin-bottom: 10px;
            color: #374151;
        }

        .qr-container {
            text-align: center;
            border-top: 1px dashed #d1d5db;
            padding-top: 20px;
        }

        .qr-container h3 {
            margin-bottom: 15px;
            color: #111827;
        }

        #qrCode {
            width: 250px;
            height: 250px;
        }

        .ticket-id {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 7px;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .ticket-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .ticket-action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn {
            background: #2563eb;
            color: white;
        }

        .download-btn:hover {
            background: #1d4ed8;
        }

        .print-btn {
            background: #111827;
            color: white;
        }

        .print-btn:hover {
            background: #374151;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #2563eb;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {

            .content {
                flex-direction: column;
                align-items: center;
            }

            .form-card,
            #ticketSection {
                width: 100%;
                max-width: 430px;
            }

        }

    </style>

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            EventPass
        </div>

        <a class="nav-link" href="index.html">
            Home
        </a>

    </nav>


    <div class="container">

        <div class="page-title">

            <h1>Event Registration</h1>

            <p>
                Register for an event and receive your digital QR ticket instantly.
            </p>

        </div>


        <div class="content">


            <!-- REGISTRATION FORM -->

            <div class="form-card">

                <h2>Participant Details</h2>

                <form id="registrationForm">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Mobile Number</label>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Enter your mobile number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Select Event</label>

                        <select id="eventName" required>

                            <option value="">
                                -- Select Event --
                            </option>

                            <option value="AI Workshop">
                                AI Workshop
                            </option>

                            <option value="Hackathon">
                                Hackathon
                            </option>

                            <option value="Technical Quiz">
                                Technical Quiz
                            </option>

                            <option value="Cloud Computing Workshop">
                                Cloud Computing Workshop
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Register & Generate Ticket
                    </button>

                </form>


                <p id="message"></p>

            </div>


            <!-- GENERATED TICKET -->

            <div id="ticketSection">

                <div class="ticket">

                    <div class="ticket-header">

                        <h2>EventPass Ticket</h2>

                        <p>
                            Digital Event Entry Pass
                        </p>

                    </div>


                    <div class="ticket-body">

                        <div class="ticket-info">

                            <p>
                                <strong>Participant:</strong>
                                <span id="ticketName"></span>
                            </p>

                            <p>
                                <strong>Event:</strong>
                                <span id="ticketEvent"></span>
                            </p>

                        </div>


                        <div class="qr-container">

                            <h3>Scan at Entry</h3>

                            <img
                                id="qrCode"
                                width="250"
                                height="250"
                                alt="EventPass QR Code"
                            >

                        </div>


                        <div class="ticket-id">

                            Ticket ID:
                            <span id="ticketId"></span>

                        </div>


                        <!-- TICKET ACTION BUTTONS -->

                        <div class="ticket-actions">

                            <button
                                class="ticket-action-btn download-btn"
                                onclick="downloadQR()"
                            >
                                Download QR
                            </button>

                            <button
                                class="ticket-action-btn print-btn"
                                onclick="printTicket()"
                            >
                                Print Ticket
                            </button>

                        </div>

                    </div>

                </div>

            </div>


        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>


    <script>

        // Automatically select the event passed from the homepage.
        const eventFromURL = new URLSearchParams(window.location.search).get("event");
        const eventDropdown = document.getElementById("eventName");

        if (eventFromURL) {
            const matchingOption = Array.from(eventDropdown.options).find(
                option => option.value === eventFromURL
            );

            if (matchingOption) {
                eventDropdown.value = eventFromURL;
            }
        }

        document
        .getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const participant = {

                name:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value,

                mobile:
                    document.getElementById("mobile").value,

                eventName:
                    document.getElementById("eventName").value

            };


            fetch("/register", {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body:
                    JSON.stringify(participant)

            })


            .then(response => response.json())


            .then(data => {

                document
                .getElementById("message")
                .innerText =
                    "Registration successful! Your ticket is ready.";


                document
                .getElementById("ticketName")
                .innerText =
                    data.name;


                document
                .getElementById("ticketEvent")
                .innerText =
                    data.eventName;


                document
                .getElementById("ticketId")
                .innerText =
                    data.ticketId;


                document
                .getElementById("qrCode")
                .src =
                    "/qr?ticketId=" + data.ticketId;


                document
                .getElementById("ticketSection")
                .style.display =
                    "block";

            })


            .catch(error => {

                document
                .getElementById("message")
                .innerText =
                    "Registration failed.";

                console.error(error);

            });

        });


        // DOWNLOAD QR CODE

        function downloadQR() {

            const qrImage =
                document.getElementById("qrCode");

            const ticketId =
                document.getElementById("ticketId").innerText;

            const link =
                document.createElement("a");

            link.href = qrImage.src;

            link.download =
                "EventPass-" + ticketId + ".png";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

        }


        // PRINT TICKET

        function printTicket() {

            const ticket =
                document.querySelector(".ticket");

            const printWindow =
                window.open("", "_blank");

            printWindow.document.write(`

                <!DOCTYPE html>

                <html>

                <head>

                    <title>EventPass Ticket</title>

                    <style>

                        body {
                            font-family: Arial, sans-serif;
                            display: flex;
                            justify-content: center;
                            padding: 40px;
                        }

                        .ticket {
                            width: 430px;
                            background: white;
                            border: 1px solid #ddd;
                            border-radius: 15px;
                            overflow: hidden;
                        }

                        .ticket-header {
                            background: #111827;
                            color: white;
                            padding: 25px;
                        }

                        .ticket-header h2 {
                            margin: 0 0 7px 0;
                        }

                        .ticket-header p {
                            margin: 0;
                            color: #d1d5db;
                        }

                        .ticket-body {
                            padding: 25px;
                        }

                        .ticket-info p {
                            margin-bottom: 10px;
                        }

                        .qr-container {
                            text-align: center;
                            border-top: 1px dashed #ccc;
                            padding-top: 20px;
                        }

                        .qr-container img {
                            width: 250px;
                            height: 250px;
                        }

                        .ticket-id {
                            background: #f3f4f6;
                            padding: 10px;
                            border-radius: 7px;
                            text-align: center;
                            margin-top: 15px;
                            font-weight: bold;
                        }

                    </style>

                </head>

                <body>

                    <div class="ticket">

                        ${ticket.innerHTML}

                    </div>

                </body>

                </html>

            `);

            printWindow.document.close();

            printWindow.focus();

            setTimeout(function() {

                printWindow.print();

                printWindow.close();

            }, 500);

        }

    </script>

</body>
</html>
