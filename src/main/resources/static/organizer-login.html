<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventPass TT | Organizer Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070b18;
            --card: #10182b;
            --blue: #3984ff;
            --cyan: #55d6ff;
            --text: #f5f7ff;
            --muted: #929db5;
            --border: rgba(255, 255, 255, 0.09);
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%,
                    rgba(57, 132, 255, 0.16), transparent 35%),
                radial-gradient(circle at 80% 80%,
                    rgba(85, 214, 255, 0.10), transparent 35%),
                var(--bg);

            color: var(--text);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 62px;
            height: 62px;

            margin: 0 auto 16px;
            border-radius: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: bold;
            color: white;

            background: linear-gradient(135deg, var(--blue), var(--cyan));

            box-shadow: 0 0 35px rgba(57, 132, 255, 0.35);
        }

        .brand h1 {
            font-size: 29px;
            letter-spacing: 2px;
        }

        .brand h1 span {
            color: var(--cyan);
        }

        .brand p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-card {
            background: rgba(16, 24, 43, 0.94);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 36px;

            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
        }

        .card-heading {
            margin-bottom: 28px;
        }

        .card-heading h2 {
            font-size: 25px;
            margin-bottom: 9px;
        }

        .card-heading p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
        }

        .field {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 10px;

            font-size: 13px;
            font-weight: bold;
            color: #dce5f8;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 15px;

            color: white;
            background: #0a1122;

            border: 1px solid #27334b;
            border-radius: 11px;

            outline: none;
            font-size: 14px;

            transition: 0.25s;
        }

        #password {
            padding-right: 65px;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(57, 132, 255, 0.13);
        }

        input::placeholder {
            color: #65718a;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;
            color: var(--cyan);

            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 7px;

            border: none;
            border-radius: 11px;

            background: linear-gradient(100deg, var(--blue), #2563eb);

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(57, 132, 255, 0.25);
        }

        #message {
            display: none;
            padding: 12px;
            margin-top: 18px;

            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        #message.error {
            display: block;
            background: rgba(255, 70, 90, 0.1);
            color: #ff8795;
            border: 1px solid rgba(255, 70, 90, 0.2);
        }

        .back-link {
            display: block;
            margin-top: 25px;

            text-align: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;

            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--cyan);
        }

        .security-note {
            margin-top: 23px;
            text-align: center;

            font-size: 11px;
            line-height: 1.7;
            color: #69758e;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 22px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <header class="brand">

            <div class="logo">EP</div>

            <h1>EVENTPASS <span>TT</span></h1>

            <p>Your event management workspace</p>

        </header>


        <section class="login-card">

            <div class="card-heading">

                <h2>Welcome back 👋</h2>

                <p>
                    Sign in to access your organizer dashboard
                    and manage event registrations.
                </p>

            </div>


            <form id="loginForm">

                <div class="field">

                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="field">

                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <button type="submit" class="login-button">
                    Sign In to Dashboard →
                </button>

                <p id="message" role="alert"></p>

            </form>


            <a href="index.html" class="back-link">
                ← Back to EventPass Home
            </a>

        </section>


        <p class="security-note">
            EVENTPASS TT · ORGANIZER ACCESS
        </p>

    </main>


    <script>

        const loginForm = document.getElementById("loginForm");

        const usernameInput = document.getElementById("username");

        const passwordInput = document.getElementById("password");

        const message = document.getElementById("message");

        const togglePassword = document.getElementById("togglePassword");


        // Show or hide password

        togglePassword.addEventListener("click", function () {

            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            togglePassword.textContent = isHidden ? "HIDE" : "SHOW";

        });


        // Organizer login

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const username = usernameInput.value.trim();

            const password = passwordInput.value;


            if (
                username === "eventpasstt" &&
                password === "project123"
            ) {

                sessionStorage.setItem(
                    "eventpassOrganizerLoggedIn",
                    "true"
                );

                window.location.href = "organizer-dashboard.html";

            } else {

                message.textContent =
                    "Incorrect username or password. Please try again.";

                message.className = "error";

                passwordInput.value = "";

                passwordInput.focus();

            }

        });

    </script>

</body>

</html>
